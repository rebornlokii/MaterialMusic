name: Mornye APK

# End-to-end proof for the Mornye integration: builds the Rust backend, drops the
# native libraries into the app, and produces a debug APK that contains them.
#
# Run from the Actions tab (workflow_dispatch). Pick a Mornye ref to test a
# specific upstream version.

on:
  workflow_dispatch:
    inputs:
      mornye_ref:
        description: "Mornye git ref (tag, branch or sha)"
        required: false
        default: "v5.4.5"
      abis:
        description: "Comma-separated Android ABIs"
        required: false
        default: "arm64-v8a,armeabi-v7a"

permissions:
  contents: read
  actions: read

concurrency:
  group: mornye-apk-${{ inputs.mornye_ref || 'v5.4.5' }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/mornye-backend.yml
    with:
      mornye_ref: ${{ inputs.mornye_ref || 'v5.4.5' }}
      abis: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: backend
    env:
      NDK_VERSION: "30.0.16248370"

    steps:
      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout MaterialMusic
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Download backend
        uses: actions/download-artifact@v7
        with:
          name: mornye-backend
          path: mornye-backend

      - name: Install native libraries
        run: |
          set -euo pipefail
          cat mornye-backend/BUILD_INFO.txt
          mkdir -p app/src/main/jniLibs
          cp -R mornye-backend/jniLibs/. app/src/main/jniLibs/
          find app/src/main/jniLibs -name '*.so' -printf '%p  %s bytes\n' | sort

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Ppixelplayer.enableAbiSplits=false

      - name: Verify APK contains the backend
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk=$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'libmornye_mobile\.so' || {
            echo "libmornye_mobile.so missing from APK" >&2; exit 1; }
          unzip -l "$APK" | grep -E 'libmornye_mobile\.so'

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: materialmusic-mornye-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14